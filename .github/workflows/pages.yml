# Publishes the web page (site/) with GitHub Pages: https://yuniorrguez13-a11y.github.io/breathalyzer/
# Runs when site/ changes on main, or by hand. Only site/ goes online (DESIGN.md is left out).
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the page (without the design notes)
        run: |
          mkdir _site
          cp -r site/. _site/
          rm -f _site/DESIGN.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
