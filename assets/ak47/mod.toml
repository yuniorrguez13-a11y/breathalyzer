# A secret extra that comes with the multiplayer mod (Ghost multiplayer), by giruka (docs/easter-eggs.md).
# This folder is a recipe, not a mod you add as it is: it holds no game files. tools/ak47_build.py builds two mods on
# your PC from your own game files (the Traveler's Claymore's actor, model and icon as the base, the map, the size
# table) and the model in this folder, then adds them to your mod library:
#   python tools/ak47_build.py build
# This mod.toml is the item's (giruka.ak47: its model, actor, texts and flags). It has no part_of, so it stays on
# while the multiplayer mod is off: a save that holds the item keeps loading. spot.toml is the other mod's (where one
# lies: only while the multiplayer mod is on). secret: Home, More... and the game's Mods page never list them.

[mod]
id = "giruka.ak47"
name = "Extra item"
version = "0.2.0"
authors = ["giruka"]
description = "Data for a hidden extra. Stays on so saves that hold it keep loading."
game_versions = ["1.9.0"]
secret = true
