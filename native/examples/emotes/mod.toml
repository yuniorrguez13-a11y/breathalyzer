# emotes: Link's emotes and a ragdoll (docs/emotes.md), by giruka. Experimental: not yet run in the game.
# Install it with the mod manager (docs/mod-manager.md):
#   python tools/build_native.py build
#   python tools/modman.py add native/examples/emotes
#   python tools/emote_build.py build        (the animations, built on your PC from your own game files)
# emotes.dll isn't in this folder: for the examples in this repo, modman takes it from build\native\emotes-mods,
# where build_native.py puts it (docs/mod-format.md). Add the example again after you rebuild it.
# It needs no hook slots: it wraps Link's own per-frame update through hle_override.
# The emote wheel (hold G, or D-pad Down) is drawn by modhost's overlay host (native/modhost/swmod_overlay.h): it needs
# the modhost of this repo and Savage Wind 0.4.1-alpha.4; elsewhere the wheel stays off and the rest works.
# The block at the end (the favourite keys and the Play page) is made by: python tools/emote_build.py header

[mod]
id = "botw-mod-loader.emotes"
name = "Emotes"
version = "0.3.0"
authors = ["giruka"]
description = "Dances, thumbs up and down, and a ragdoll for Link: hold G (or D-pad Down) for the emote wheel, or keys 5 to 0, the console command emote, the Play page. Changes a game file (Link's animation list), so it starts off."
game_versions = ["1.9.0"]   # it calls game functions by their 1.9.0 addresses
loader_api = 3              # reads its settings through the mod API (version 3)

[code]
windows = "emotes.dll"

[[pages]]
key = "wheel"
label = "Wheel favourites"
description = "The 8 emotes on the first page of the wheel."

[[pages]]
key = "keys"
label = "Emote keys"
description = "Which emote each number key plays."

[[pages]]
key = "play"
label = "Play an emote"
description = "Press Play, then close the menu: Link does it."

[[settings]]
key = "keys"
type = "toggle"
label = "Number keys 5 to 0"
description = "The keys 5 6 7 8 9 0 (and the numpad's) play your favourite emotes."
default = true
applies = "live"

[[settings]]
key = "ragdoll"
type = "toggle"
label = "Allow ragdoll"
description = "Key 0 and emote ragdoll throw Link forward, limp, to the ground. He gets up."
default = true
applies = "live"

[[settings]]
key = "share"
type = "toggle"
label = "Show friends my emotes"
description = "In multiplayer, friends see your emotes (comes with a later update)."
default = true
applies = "live"

[[settings]]
key = "extras"
type = "text"
label = "Extra emotes"
description = "Ids of emotes you added to tools/emotes, comma between: the wheel's Extras page."
default = ""
max_length = 64
applies = "restart"

[[settings]]
key = "wheel"
type = "toggle"
label = "Emote wheel"
description = "Hold the wheel key (or D-pad Down) for a big wheel of emotes. Let go to play."
default = true
applies = "live"

[[settings]]
key = "wheel_key"
type = "key"
label = "Wheel key"
description = "Hold it for the wheel, let go to play. A quick tap keeps the wheel open."
default = "G"
applies = "live"

[[settings]]
key = "wheel_pad"
type = "choice"
label = "Controller wheel"
description = "Hold D-pad Down for half a second. Link may whistle first."
default = "dpad_down"
applies = "live"
choices = [
  { value = "dpad_down", label = "Hold D-pad Down" },
  { value = "off", label = "Off" },
]

[[settings]]
key = "wheel_size"
type = "slider"
label = "Wheel size"
description = "How big the wheel and its names are."
min = 100
max = 200
step = 25
default = 150
unit = " percent"
applies = "live"

[[settings]]
key = "show_names"
type = "toggle"
label = "Show emote name"
description = "Shows the emote's name at the bottom for 2 seconds, or why it can't play."
default = true
applies = "live"

