# ghost: shows another player as a stand-in actor in your world (docs/ghost.md). Experimental.
# Install it with the mod manager (docs/mod-manager.md):
#   python tools/build_native.py build
#   python tools/modman.py add native/examples/ghost
# ghost.dll isn't in this folder: for the examples in this repo, modman takes it from build\native\ghost-mods,
# where build_native.py puts it (docs/mod-format.md). Add the example again after you rebuild it.
# It needs no hook slots: it wraps a per-frame game job through hle_override.

[mod]
id = "botw-mod-loader.ghost"
name = "Ghost (example, experimental)"
version = "0.8.0"
authors = ["giruka"]
description = "Adds the control command ghost: spawn, move (smoothly), animate and remove a stand-in (a Sheikah man, or the Link body pack) for another player; ghost self reads your own Link (animation, weapon) for animation sync. The sync is opt-in; tested in game on one PC, not yet over two. 0.7.0 adds the control command coop (story flags for co-op, docs/coop.md); 0.7.1 adds live only towers and memories, only at a safe point (not yet run in the game). 0.8.0 adds the console command iam (Who am I: pick who your friends see you as, docs/charsel.md; not yet run in the game)."
game_versions = ["1.9.0"]   # it calls game functions by their 1.9.0 addresses
loader_api = 2

[code]
windows = "ghost.dll"
