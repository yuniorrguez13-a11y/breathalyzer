# perf_effects: turns some of the game's post effects off for more fps (docs/performance.md).
# This folder is a recipe, not a mod you add as it is: it holds no game files. tools/quality.py builds the mod from
# your own game's Pack/Bootup.pack (Env/env.sgenvb: the ambient occlusion, bloom and far depth-of-field switches,
# see recipe.json) and adds it to your mod library with this mod.toml:
#   python tools/quality.py set medium         (or: python tools/quality.py toggle ssao off)

[mod]
id = "botw-mod-loader.perf-effects"
name = "Performance: effects off"
version = "1.0.0"
authors = ["botw-mod-loader"]
description = "Ambient occlusion, bloom and far blur off as tools/quality.py picks (built from your game files)."

[data]
romfs = "romfs"
