# The mods that come with Breathalyzer Plus (tools/make_release.py --edition plus). docs/release.md explains it all.
#
# Only our own mods: ids start with botw-mod-loader. or giruka., every file comes from this repo (git-tracked) or from
# build\native (DLLs build_native.py or modmenu.py built here). Never game files, never mods by other people, never
# the stress-test mods, never anything from out\.
#
# title, description: what the mod picker and the game's Mods page show. Plain words; the description is one line of
#   at most 80 characters (the Mods page cuts there) in plain ASCII, without { } | ` ^ ~ % # (the game font lacks them).
# default: "on" or "off" in the picker. The rule: a mod that changes nothing until you use it is on; a mod that
#   changes the game (gameplay, looks, a game file), costs fps or uses the network is off.
# why: why that default (shown under Details).
# tags: short notes the picker shows on the mod's card (plain words: "You type a command for it", not "console").
# developer: true when the mod's commands need developer mode: Play turns developer commands on while it is ON.
# egg: true for an easter egg. Secret: the picker and Home never list it one by one; one switch "Enable easter
#   eggs?" (OFF at first) turns every egg = true mod on or off together. An egg always starts OFF (keep default "off").
# ready: true = in the Plus zip. false = not tested enough yet: left out (make_release --with-experimental adds the
#   built ones, marked Experimental and off).
# kind "code": a DLL. manifest = its mod.toml, dll = the built DLL (a path under build/native).
# kind "recipe": built on the player's PC from their own game files when it is first turned on: folder = the recipe
#   (shipped in app\ anyway), build = the tool commands that build it (tools\<tool> <args>), in order.
# after_add: tool commands to run once the mod is in the library.
# after_on, after_on_makes: tool commands that build a bonus of the mod (the mod after_on_makes names) from the
#   player's game files, run when the mod is turned on while the library has no after_on_makes yet: the picker's Save
#   with it ON, else the next Play (after Home or the game's Mods page turned it on). Players who never turn the mod on
#   never pay for the bonus. Its id never shows in Details.

[[mod]]
id = "botw-mod-loader.modmenu"
title = "Mods page in the game"
description = "Adds a Mods page to the game's Options: turn mods on or off there."
default = "on"
why = "It only adds a page to the game's Options."
tags = []
ready = true
kind = "code"
manifest = "build/native/modmenu-mods/modmenu/mod.toml"   # written by python tools/modmenu.py setup
dll = "build/native/modmenu-mods/modmenu/modmenu.dll"
after_add = [["modmenu.py", "sync"]]

[[mod]]
id = "botw-mod-loader.basics-show-pos"
title = "Show Position"
description = "Type where in the command box (press F12) to see where Link is."
default = "on"
why = "It does nothing until you type its command."
tags = ["You type a command for it"]
ready = true
kind = "code"
manifest = "native/examples/basics_show_pos/mod.toml"
dll = "build/native/basics-mods/basics_show_pos.dll"

[[mod]]
id = "botw-mod-loader.basics-inf-stamina"
title = "Infinite Stamina"
description = "Stamina never runs out. Type infstamina off in the command box (F12) to stop."
default = "off"
why = "It changes how the game plays."
tags = ["Changes how the game plays", "While it is on, Play turns on developer commands"]
developer = true
ready = true
kind = "code"
manifest = "native/examples/basics_inf_stamina/mod.toml"
dll = "build/native/basics-mods/basics_inf_stamina.dll"

[[mod]]
id = "botw-mod-loader.basics-teleport-up"
title = "Teleport Up"
description = "Type up in the command box (press F12) to lift Link 10 meters."
default = "off"
why = "It moves Link, and he can get stuck."
tags = ["You type a command for it", "While it is on, Play turns on developer commands"]
developer = true
ready = true
kind = "code"
manifest = "native/examples/basics_teleport_up/mod.toml"
dll = "build/native/basics-mods/basics_teleport_up.dll"

[[mod]]
id = "botw-mod-loader.perf-effects"
title = "Performance: effects off"
description = "No glow, soft shadows or far blur, so the game runs smoother on a slow PC."
default = "off"
why = "It changes how the game looks."
tags = ["Built from your game files the first time (about 1 minute)", "Changes how the game looks",
        "Turns off Savage Wind's button letters and voice fix"]
ready = true
kind = "recipe"
folder = "native/examples/perf_effects"
build = [["quality.py", "toggle", "ssao", "off"], ["quality.py", "toggle", "bloom", "off"],
         ["quality.py", "toggle", "dof", "off"]]

# ---- not ready yet: never in the Plus zip unless --with-experimental (and then only if built)

[[mod]]
id = "botw-mod-loader.ghost"
title = "Ghost multiplayer"
description = "See a friend in your world as a stand-in figure (home network only)."
default = "off"
why = "It uses the network, and playing the story together isn't tested on two PCs yet."
tags = ["Experimental", "Uses the network (home network only)", "Host or join on Home: Multiplayer",
        "While it is on, Play turns on developer commands",
        "Comes with a surprise, built when you first turn it on (about 1 minute)"]
# (developer: Play opens the game's control port, which tools\mp\client.py and coop_agent.py talk to; the launcher's
# Multiplayer page, tools/mp_page.py, starts them)
developer = true
ready = false
kind = "code"
manifest = "native/examples/ghost/mod.toml"
dll = "build/native/ghost-mods/ghost.dll"
# A secret extra comes with it (docs/easter-eggs.md, the AK-47): built from the player's files the first time the multiplayer
# mod is turned on, as two secret mods: giruka.ak47 (the item's data: always on once built, so a save that holds the
# item always loads) and giruka.ak47-spot (where it lies: part_of = this mod, so only while this one is on).
# --optional: a build that can't be made never stops the multiplayer mod; --quiet: its output names nothing.
after_on = [["ak47_build.py", "build", "--optional", "--quiet"]]
after_on_makes = "giruka.ak47"

# Who am I (docs/charsel.md): the character packs, built on the player's PC from their own game files (names only
# here). One card, never one per character. The mod it adds takes assets/characters/mod.toml: [mod] part_of the
# multiplayer mod, so it is used only while Ghost multiplayer is on. The Multiplayer page's Who am I builds it too
# ("Build the characters"), with the same command.
[[mod]]
id = "botw-mod-loader.characters"
title = "Characters for multiplayer"
description = "See your friends as who they pick: Zelda, a Goron, a Bokoblin and more."
default = "off"
why = "It is part of Ghost multiplayer and is built from your game files: only for players who want it."
tags = ["Experimental", "Built from your game files the first time (a few minutes)",
        "Used only while Ghost multiplayer is on", "Pick who you are: Home, Multiplayer, Who am I"]
ready = false
kind = "recipe"
folder = "assets/characters"
build = [["charsel.py", "build", "--add"]]

[[mod]]
id = "botw-mod-loader.zelda-view"
title = "Secret word"
description = "A hidden easter egg for the game's console."
default = "off"
why = "An easter egg: the one easter-egg switch turns it on. Its hooks make the first start 10-20 minutes longer."
tags = ["Experimental", "First start takes 10-20 minutes longer"]
egg = true
ready = false
kind = "code"
manifest = "native/examples/zelda_view/mod.toml"
dll = "build/native/hook-mods/zelda_view.dll"

[[mod]]
id = "giruka.castle-date"
title = "Castle date"
description = "Beat the game, find the right door in Zelda's room, and she greets you."
default = "off"
why = "It changes the castle map."
tags = ["Experimental", "Built from your game files the first time"]
ready = false
kind = "recipe"
folder = "castle"
build = [["castle_build.py", "build"]]

[[mod]]
# Dragonbreath, by giruka (docs/dragonbreath.md): a lost Goron blade forged for Daruk. A recipe: built on the
# player's PC from their own game files when first turned on (tools/dragonbreath_build.py). It also makes the secret
# item mod giruka.dragonbreath-item (no part_of: it stays on, so a save that holds the blade keeps loading).
# (No --on: the launcher turns a new recipe mod on after its build when it was picked on.)
id = "botw-mod-loader.dragonbreath"
title = "Dragonbreath"
description = "A lost Goron blade forged for Daruk. Rohan in Goron City knows where it is."
default = "off"
why = "It adds a new weapon, a diamond cave, a quest at Rohan's and new sword moves."
tags = ["Experimental", "Built from your game files the first time (about 1 minute)"]
ready = false
kind = "recipe"
folder = "assets/dragonbreath"
build = [["dragonbreath_build.py", "build", "--quiet"]]

# Left out of the beta (no visible change or fps gain was measured), so not listed even with --with-experimental:
# "Performance: shorter shadows" (botw-mod-loader.perf-shadows, recipe native/examples/perf_shadows,
# build [["quality.py", "toggle", "shadow_range", "1000"]]). List it again once it shows a change.
